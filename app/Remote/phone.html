<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>WinSwitch</title>
<style>
:root{--bg:#14171c;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--text:#f2f4f7;--soft:#aeb6c2;--quiet:#7d8794;--accent:#2f7fd8;--ok:#58e28c;--warn:#f0b45a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1f2732 0%,var(--bg) 60%);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px)}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);flex:none}
header .dot.off{background:#666;box-shadow:none}
h1{font-size:24px;margin:0;font-weight:650;letter-spacing:-.3px}
.status{color:var(--soft);font-size:13.5px;margin:0 0 18px 24px}
h2{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--quiet);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;color:var(--text);font:inherit;font-weight:600;display:flex;align-items:center;gap:10px;min-height:56px}
.profile i{width:12px;height:12px;border-radius:50%;flex:none}
.profile.on{border-color:var(--accent);background:rgba(47,127,216,.18)}
.auto{grid-column:1/-1;justify-content:center;font-weight:500;color:var(--soft)}
.auto.on{color:var(--text)}
.row{display:flex;align-items:center;gap:12px;padding:6px 0}
.row+.row{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.row .label{flex:1}
.row .label small{display:block;color:var(--quiet);font-size:12.5px}
.switch{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.16);position:relative;border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--ok)}.switch.on::after{transform:translateX(20px)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(255,255,255,.16) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.icon{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:var(--text);font-size:18px;flex:none}
.icon.on{background:var(--warn);color:#222}
.value{width:44px;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:9px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent)}
.power{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.power button{background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:13.5px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.power button span{font-size:22px}
.power button.danger{color:#ffb3a8}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,40px);opacity:0;background:rgba(32,36,44,.96);border:1px solid var(--line);padding:10px 16px;border-radius:12px;transition:.25s;font-size:14px;max-width:90%}
.toast.show{transform:translate(-50%,0);opacity:1}
.media{display:flex;align-items:center;gap:12px}
.media .what{flex:1;min-width:0}
.media .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media .artist{color:var(--soft);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media button{width:46px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;flex:none}
.media button.big{width:56px;height:56px;border-radius:28px;background:var(--accent);border-color:var(--accent);font-size:22px}
.hidden{display:none!important}
.offline{color:var(--warn);margin:40px 8px;text-align:center}
dialog{background:#20242c;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:320px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .buttons{display:flex;gap:10px;margin-top:16px}
dialog button{flex:1;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;background:rgba(255,255,255,.12);color:var(--text)}
dialog button.go{background:#d8452f}
</style>
</head>
<body>
<header><div class="dot off" id="dot"></div><h1 id="pc">WinSwitch</h1></header>
<p class="status" id="status">Connecting…</p>
<div id="main" class="hidden">
  <section data-action="profile"><h2>Profile</h2><div class="profiles" id="profiles"></div></section>
  <section data-action="tweak" id="tweakSection"><h2>Tweaks</h2><div class="card" id="tweaks"></div></section>
  <section id="soundSection"><h2>Playing</h2><div class="card">
    <div class="row media" data-action="media"><div class="what"><div class="title" id="mediaTitle"></div><div class="artist" id="mediaArtist"></div></div><button id="previous">⏮</button><button class="big" id="playPause">⏯</button><button id="next">⏭</button></div>
    <div class="row" data-action="volume"><button class="icon" id="mute" data-action="mute">🔊</button><input type="range" id="volume" min="0" max="100"><span class="value" id="volumeValue"></span></div>
  </div></section>
  <section id="screenSection"><h2>Screen</h2><div class="card">
    <div class="row" data-action="brightness" id="brightnessRow"><button class="icon" disabled>☀︎</button><input type="range" id="brightness" min="0" max="100"><span class="value" id="brightnessValue"></span></div>
  </div></section>
  <section data-action="awake"><h2>Keep awake</h2><div class="chips" id="awake"></div></section>
  <section id="powerSection"><h2>Power</h2><div class="power" id="power"></div></section>
</div>
<p class="offline hidden" id="offline">Can't reach the PC. It may be asleep, off, or on another network.</p>
<div class="toast" id="toast"></div>
<dialog id="confirm"><div id="confirmText"></div><div class="buttons"><button id="confirmNo">Cancel</button><button class="go" id="confirmYes">Yes</button></div></dialog>
<script>
const token = location.pathname.split('/')[2];
const $ = id => document.getElementById(id);
let state = null, dragging = false;
const powerButtons = [['screenoff','🌙','Screen off'],['lock','🔒','Lock'],['sleep','💤','Sleep'],['hibernate','🧊','Hibernate'],['restart','🔄','Restart'],['shutdown','⏻','Shut down']];
const awakeChoices = [[0,'Off'],[30,'30 min'],[60,'1 hour'],[120,'2 hours'],[-1,'Until I stop it']];

async function call(action, body) {
  try {
    const response = await fetch('/api/' + action, { method: action === 'state' ? 'GET' : 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: action === 'state' ? undefined : JSON.stringify(body || {}) });
    const reply = await response.json();
    if (action !== 'state' && reply.ok === false) toast(reply.message || reply.error || 'That didn\'t work');
    if (reply.pc) render(reply);
    $('offline').classList.add('hidden'); $('dot').classList.remove('off');
    return reply;
  } catch (error) { $('offline').classList.remove('hidden'); $('dot').classList.add('off'); $('status').textContent = 'Not connected'; return null; }
}

function render(next) {
  state = next; $('main').classList.remove('hidden');
  document.title = 'WinSwitch ' + state.pc; $('pc').textContent = state.pc;
  const power = state.hasBattery ? (state.pluggedIn ? 'plugged in' : 'on battery') + ', ' + state.battery + '%' : '';
  $('status').textContent = [state.profile + (state.automatic ? ' (automatic)' : ''), power, state.awake ? 'kept awake' + (state.awakeUntil ? ' until ' + state.awakeUntil : '') : ''].filter(Boolean).join(' · ');
  const allowed = new Set(state.allowed);
  document.querySelectorAll('[data-action]').forEach(element => element.classList.toggle('hidden', !allowed.has(element.dataset.action)));
  // Profiles, plus Automatic
  const profiles = $('profiles'); profiles.innerHTML = '';
  state.profiles.forEach(profile => { const button = document.createElement('button'); button.className = 'profile' + (profile.name === state.profile && !state.automatic ? ' on' : ''); button.innerHTML = '<i></i><span></span>'; button.querySelector('i').style.background = profile.colour; button.querySelector('span').textContent = profile.name; button.onclick = () => call('profile', { name: profile.name }); profiles.appendChild(button); });
  const auto = document.createElement('button'); auto.className = 'profile auto' + (state.automatic ? ' on' : ''); auto.textContent = state.automatic ? '✓ Automatic: ' + state.reason : 'Back to automatic'; auto.onclick = () => call('profile', { name: 'automatic' }); profiles.appendChild(auto);
  // Tweaks
  $('tweakSection').classList.toggle('hidden', !allowed.has('tweak') || state.tweakList.length === 0);
  const tweaks = $('tweaks'); tweaks.innerHTML = '';
  state.tweakList.forEach(tweak => { const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<div class="label"></div><button class="switch"></button>'; row.querySelector('.label').textContent = tweak.name; const toggle = row.querySelector('.switch'); toggle.classList.toggle('on', tweak.on); toggle.onclick = () => call('tweak', { id: tweak.id, on: !tweak.on }); tweaks.appendChild(row); });
  // Sound and screen
  if (!dragging) { setRange('volume', state.volume); setRange('brightness', state.brightness); }
  $('brightnessRow').classList.toggle('hidden', !allowed.has('brightness') || state.brightness === null);
  $('mute').classList.toggle('on', !!state.muted); $('mute').textContent = state.muted ? '🔇' : '🔊'; $('mute').classList.toggle('hidden', !allowed.has('mute'));
  $('soundSection').classList.toggle('hidden', !allowed.has('volume') && !allowed.has('media'));
  $('screenSection').classList.toggle('hidden', !allowed.has('brightness') || state.brightness === null);
  // Playing (whatever Windows is playing)
  const media = state.media;
  $('mediaTitle').textContent = media && media.title ? media.title : 'Nothing playing';
  $('mediaArtist').textContent = media ? [media.artist, media.app].filter(Boolean).join(' · ') : '';
  $('playPause').textContent = media && media.playing ? '⏸' : '▶';
  // Keep awake
  const awake = $('awake'); awake.innerHTML = '';
  awakeChoices.forEach(([minutes, label]) => { const chip = document.createElement('button'); chip.className = 'chip' + ((minutes === 0 ? !state.awake : false) ? ' on' : ''); chip.textContent = label; chip.onclick = () => call('awake', minutes === 0 ? { on: false } : minutes < 0 ? { on: true } : { minutes }); awake.appendChild(chip); });
  if (state.awake) awake.children[state.awakeUntil ? 0 : 4].classList.toggle('on', !state.awakeUntil), state.awakeUntil || awake.children[4].classList.add('on');
  // Power
  const powerGrid = $('power'); powerGrid.innerHTML = '';
  powerButtons.filter(([action]) => allowed.has(action) && (action !== 'hibernate' || state.canHibernate)).forEach(([action, icon, label]) => { const button = document.createElement('button'); button.className = action === 'shutdown' || action === 'restart' ? 'danger' : ''; button.innerHTML = '<span>' + icon + '</span>' + label; button.onclick = () => action === 'shutdown' || action === 'restart' ? confirmThen(label + ' ' + state.pc + ' now?', () => call(action)) : call(action).then(reply => reply && reply.ok && toast(label + ' sent')); powerGrid.appendChild(button); });
  $('powerSection').classList.toggle('hidden', powerGrid.children.length === 0);
}

function setRange(id, value) { const range = $(id); if (value === null || value === undefined) return; range.value = value; range.style.setProperty('--fill', value + '%'); $(id + 'Value').textContent = value + '%'; }
['volume', 'brightness'].forEach(id => {
  const range = $(id); let timer = null, sent = null;
  range.oninput = () => { dragging = true; setRange(id, +range.value); clearTimeout(timer); timer = setTimeout(() => { sent = +range.value; call(id, { level: sent }); }, 150); };
  range.onchange = () => { dragging = false; clearTimeout(timer); if (+range.value !== sent) call(id, { level: +range.value }); };
});
$('playPause').onclick = () => call('media', { command: 'playpause' });
$('next').onclick = () => call('media', { command: 'next' });
$('previous').onclick = () => call('media', { command: 'previous' });
$('mute').onclick = () => call('mute', { on: !(state && state.muted) });

function confirmThen(text, action) { $('confirmText').textContent = text; const dialog = $('confirm'); $('confirmYes').onclick = () => { dialog.close(); action(); }; $('confirmNo').onclick = () => dialog.close(); dialog.showModal(); }
let toastTimer; function toast(text) { const element = $('toast'); element.textContent = text; element.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => element.classList.remove('show'), 2400); }

call('state'); setInterval(() => { if (!document.hidden && !dragging) call('state'); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) call('state'); });
</script>
</body>
</html>
